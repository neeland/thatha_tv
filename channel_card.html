<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thatha's Channel Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one A4 sheet, nine rows of remote button → channel, black on white for printing and laminating.
   A single light look on purpose: it is made for paper. */
:root {
  --paper: #ffffff;
  --ink: #111417;
  --key: #111417;
  --key-ink: #ffffff;
  --muted: #4a5258;
  --rule: #c9cfd3;
  --font: "Atkinson Hyperlegible", "Verdana", "Arial", sans-serif;
  color-scheme: light;
}
body {
  background: var(--paper); color: var(--ink); font-family: var(--font); font-weight: 700;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.card { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
h1 { margin: 0 0 4px; font-size: 1.6rem; text-align: center; text-wrap: balance; }
ol { list-style: none; margin: 0; padding: 0; display: grid; }
li {
  display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: 18px;
  padding-block: 10px; border-bottom: 3px solid var(--rule);
}
li:last-child { border-bottom: 0; }
.key {
  width: 4.6rem; height: 4.6rem; border-radius: 50%; background: var(--key); color: var(--key-ink);
  display: grid; place-items: center; font-size: 3rem; line-height: 1;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.to { font-size: 2.4rem; color: var(--muted); }
.ch { display: grid; min-width: 0; }
.num { font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.name { font-size: 1.15rem; font-weight: 400; color: var(--muted); }

@page { size: A4 portrait; margin: 12mm; }
@media print {
  body { padding: 0; }
  .card { max-width: none; gap: 2mm; }
  h1 { font-size: 22pt; }
  li { padding-block: 2.5mm; column-gap: 7mm; border-bottom-width: 0.6mm; }
  .key { width: 21mm; height: 21mm; font-size: 40pt; }
  .to { font-size: 30pt; }
  .num { font-size: 46pt; }
  .name { font-size: 14pt; }
}
</style>

<main class="card">
  <h1>Press a number for your channel</h1>
  <ol aria-label="Remote buttons and their channels">
    <li><span class="key">1</span><span class="to">→</span><span class="ch"><span class="num">167</span><span class="name">Star Life</span></span></li>
    <li><span class="key">2</span><span class="to">→</span><span class="ch"><span class="num">201</span><span class="name">SuperSport Grandstand</span></span></li>
    <li><span class="key">3</span><span class="to">→</span><span class="ch"><span class="num">203</span><span class="name">SuperSport Premier League</span></span></li>
    <li><span class="key">4</span><span class="to">→</span><span class="ch"><span class="num">204</span><span class="name">SuperSport La Liga</span></span></li>
    <li><span class="key">5</span><span class="to">→</span><span class="ch"><span class="num">212</span><span class="name">SuperSport Cricket</span></span></li>
    <li><span class="key">6</span><span class="to">→</span><span class="ch"><span class="num">213</span><span class="name">SuperSport Golf</span></span></li>
    <li><span class="key">7</span><span class="to">→</span><span class="ch"><span class="num">401</span><span class="name">CNN International</span></span></li>
    <li><span class="key">8</span><span class="to">→</span><span class="ch"><span class="num">402</span><span class="name">Sky News</span></span></li>
    <li><span class="key">9</span><span class="to">→</span><span class="ch"><span class="num">403</span><span class="name">eNCA</span></span></li>
  </ol>
</main>
