<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thatha TV">
<title>Thatha TV</title>
<style>
  body { margin: 0; padding: 24px; background: #111; color: #fff;
         font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  h1 { font-size: 2.5rem; margin: 0 0 8px; }
  #status { font-size: 1.6rem; min-height: 2.2em; margin-bottom: 16px; padding: 12px; border-radius: 14px; color: #ccc; }
  body.locked #status { background: #b26a00; color: #fff; font-weight: 700; }
  body.locked #status::before { content: "🔒 "; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  button { font-size: 4rem; font-weight: 700; padding: 40px 0; border: 0; border-radius: 20px;
           background: #1e5bd8; color: #fff; }
  button { position: relative; transition: opacity .2s; }
  button:active:not(:disabled) { background: #163f96; }
  button:disabled { background: #333; color: #666; opacity: .45; }
  button:disabled::after { content: "🔒"; position: absolute; top: 8px; right: 12px; font-size: 1.6rem; }
  button.playing { background: #1f8a3d; }
  button.changing { background: #b26a00; color: #fff; opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  button.changing::after { content: "⏳"; }
  @keyframes pulse { 50% { opacity: .6; } }
  body.kiosk { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #pinpad { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 10;
            align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
  #pinpad.open { display: flex; }
  #pinpad h2 { font-size: 2rem; margin: 0; }
  #pin-dots { font-size: 3rem; letter-spacing: .4em; min-height: 1.3em; }
  #pin-msg { font-size: 1.4rem; color: #f88; min-height: 1.4em; }
  #pin-keys { display: grid; grid-template-columns: repeat(3, 110px); gap: 12px; }
  #pin-keys button { font-size: 2.4rem; padding: 20px 0; }
  #pin-keys button.small { font-size: 1.4rem; background: #444; }
</style>
</head>
<body>
<h1>Thatha TV</h1>
<div id="status">Tap a channel</div>
<div id="grid"></div>
<div id="pinpad">
  <h2>Enter PIN to exit</h2>
  <div id="pin-dots"></div>
  <div id="pin-msg"></div>
  <div id="pin-keys"></div>
</div>
<script>
const grid = document.getElementById("grid");
const status = document.getElementById("status");
let sending = false;          // true from the tap until the server answers

function render(state) {
  const busy = sending || !!state.busy;
  for (const btn of grid.children) {
    btn.disabled = busy;
    btn.classList.toggle("playing", !busy && btn.textContent === state.channel);
    btn.classList.toggle("changing", btn.textContent === state.busy);
  }
  document.body.classList.toggle("locked", busy);
  if (state.busy) status.textContent = `Changing to ${state.busy}… please wait`;
  else if (state.error) status.textContent = `Something went wrong: ${state.error}`;
  else if (state.channel) status.textContent = `Now on ${state.channel}`;
  else status.textContent = "Tap a channel";
}

async function refresh() {
  if (sending) return;          // play() refreshes once the server answers
  try {
    render(await (await fetch("/status")).json());
  } catch {
    status.textContent = "Can't reach the PC, retrying…";
  }
}

async function play(channel) {
  if (sending) return;
  sending = true;
  render({ busy: channel });
  try {
    await fetch(`/play/${channel}`, { method: "POST" });
  } catch {
    // Connection dropped; the server keeps going, so wait for /status to say it's done
  }
  sending = false;
  await refresh();
}

fetch("/channels").then(r => r.json()).then(channels => {
  for (const channel of channels) {
    const btn = document.createElement("button");
    btn.textContent = channel;
    btn.onclick = () => play(channel);
    grid.append(btn);
  }
  refresh();
  setInterval(refresh, 2000);   // picks up changes started from another iPad or before a reload
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
});

// Kiosk mode on the PC: hold the title for 5 seconds to get a PIN pad that unlocks the PC
if (new URLSearchParams(location.search).has("kiosk")) {
  document.body.classList.add("kiosk");
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  const pad = document.getElementById("pinpad");
  const dots = document.getElementById("pin-dots");
  const msg = document.getElementById("pin-msg");
  let pin = "", holdTimer, idleTimer;

  const closePad = () => { pad.classList.remove("open"); pin = ""; };
  const showPin = () => {
    dots.textContent = "●".repeat(pin.length);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(closePad, 30000);   // close if left open
  };

  async function submit() {
    try {
      const res = await fetch("/kiosk/unlock", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error);
      msg.style.color = "#8f8";
      msg.textContent = "Unlocked – closing…";
    } catch (err) {
      msg.style.color = "";
      msg.textContent = err.message;
      pin = ""; showPin();
    }
  }

  const keys = document.getElementById("pin-keys");
  for (const k of ["1","2","3","4","5","6","7","8","9","Cancel","0","OK"]) {
    const b = document.createElement("button");
    b.textContent = k;
    if (k.length > 1) b.className = "small";
    b.onclick = () => {
      if (k === "Cancel") return closePad();
      if (k === "OK") return submit();
      if (pin.length < 12) pin += k;
      showPin();
    };
    keys.append(b);
  }

  const title = document.querySelector("h1");
  title.addEventListener("pointerdown", () => {
    holdTimer = setTimeout(() => { msg.textContent = ""; pad.classList.add("open"); showPin(); }, 5000);
  });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"])
    title.addEventListener(ev, () => clearTimeout(holdTimer));
}
</script>
</body>
</html>
