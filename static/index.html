<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thatha TV">
<title>Thatha TV</title>
<style>
  body { margin: 0; padding: 24px; background: #111; color: #fff;
         font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  h1 { font-size: 2.5rem; margin: 0 0 8px; }
  #status { font-size: 1.6rem; min-height: 2.2em; margin-bottom: 16px; color: #ccc; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  button { font-size: 4rem; font-weight: 700; padding: 40px 0; border: 0; border-radius: 20px;
           background: #1e5bd8; color: #fff; }
  button:active { background: #163f96; }
  button:disabled { background: #444; color: #888; }
  button.playing { background: #1f8a3d; }
</style>
</head>
<body>
<h1>Thatha TV</h1>
<div id="status">Tap a channel</div>
<div id="grid"></div>
<script>
const grid = document.getElementById("grid");
const status = document.getElementById("status");

async function play(channel, btn) {
  const buttons = grid.querySelectorAll("button");
  buttons.forEach(b => { b.disabled = true; b.classList.remove("playing"); });
  status.textContent = `Changing to ${channel}… please wait`;
  try {
    const res = await fetch(`/play/${channel}`, { method: "POST" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    btn.classList.add("playing");
    status.textContent = `Now on ${channel}`;
  } catch (err) {
    status.textContent = `Something went wrong: ${err.message}`;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

fetch("/channels").then(r => r.json()).then(channels => {
  for (const channel of channels) {
    const btn = document.createElement("button");
    btn.textContent = channel;
    btn.onclick = () => play(channel, btn);
    grid.append(btn);
  }
});
</script>
</body>
</html>
